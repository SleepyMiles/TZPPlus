name: Bug report
description: Something in TZPPlus doesn't work right
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TZPPlus version
      placeholder: "1.1.0"
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Were you the host or a client?
      options: [Host, Client, Solo]
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Other mods
      description: Your mod list or Thunderstore / Gale / r2modman profile code (especially Elad's HUD, Frailty, AdvancedCompany).
  - type: textarea
    id: log
    attributes:
      label: Log file
      description: Drag and drop your `BepInEx/LogOutput.log` here (from the session where it happened).
    validations:
      required: true
